name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify packed tarball
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          ! grep -E '\b(tests/|coverage/|\.github/)' pack.log
          grep -E 'extension\.ts' pack.log
          grep -E 'dist/' pack.log
